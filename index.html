<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#262623">
<meta name="description" content="写真に余白と撮影情報（Exif）を添えて、色味を整え、PNGで保存できるブラウザアプリ。">
<title>Framia ― 写真に余白と撮影情報を添える</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='4' fill='%23262623'/%3E%3Crect x='3' y='3' width='16' height='16' rx='1' fill='none' stroke='%23f0dcc0' stroke-width='1.5'/%3E%3Crect x='6' y='6' width='10' height='7' fill='%23f0dcc0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Framia ― 暗室の作業台。
     UIは無彩色に近いグレーに退き、色を持つのは写真だけにする。
     選択状態だけが、Portraのハイライトと同じクリーム色で塗られる。
     ============================================================ */
  :root {
    color-scheme: dark;

    --bench:      #1c1c1a;   /* 作業台（プレビュー背景） */
    --panel:      #262623;   /* 操作パネル */
    --raised:     #30302c;   /* 入力・ボタンの地 */
    --line:       #3d3c37;   /* 輪郭線 */
    --line-soft:  #323130;   /* セクション区切り */
    --ink:        #efe9df;   /* 本文 */
    --dim:        #a8a296;   /* 補助テキスト（パネル上でコントラスト比6:1） */
    --cream:      #f0dcc0;   /* 選択・主操作 */
    --cream-ink:  #1d1a15;   /* クリーム地の上の文字 */
    --cream-glow: rgba(240, 220, 192, 0.16);

    --r-ctl: 6px;
    --r-pill: 999px;

    --font-ui: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', system-ui, sans-serif;
    --font-display: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;

    --sheet-h: 54dvh;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-ui);
    background: var(--bench);
    color: var(--ink);
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  #sidebar-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
  }

  .mark { width: 26px; height: 26px; flex-shrink: 0; color: var(--cream); }

  .brand { flex: 1; min-width: 0; }

  #sidebar-header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    line-height: 1.1;
    letter-spacing: 0.02em;
  }

  #sidebar-header .subtitle {
    font-size: 11.5px;
    color: var(--dim);
    margin-top: 3px;
  }

  .sheet-toggle {
    display: none;
    width: 40px; height: 40px;
    align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s;
  }
  .sheet-toggle:hover { background: var(--raised); }
  .sheet-toggle svg { transition: transform 0.2s; }
  .sheet-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }

  /* ===== TABS ===== */
  #tab-bar {
    display: flex;
    gap: 22px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line-soft);
  }

  .tab-btn {
    padding: 10px 0 9px;
    margin-bottom: -1px;
    background: none;
    color: var(--dim);
    border: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--cream); }

  /* ===== PANELS ===== */
  .tab-panel {
    display: none;
    flex-direction: column;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .tab-panel.active { display: flex; }
  .tab-panel::-webkit-scrollbar { width: 6px; }
  .tab-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* ===== SECTION ===== */
  .section {
    padding: 18px 18px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .section:last-child { border-bottom: 0; }

  .section-title {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .hint {
    font-size: 11.5px;
    color: var(--dim);
    line-height: 1.6;
    margin-top: 4px;
  }

  /* ===== PHOTO PICKER ===== */
  #drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 100%;
    padding: 14px 10px;
    border: 1px dashed var(--line);
    border-radius: var(--r-ctl);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }
  #drop-zone small { font-size: 11.5px; font-weight: 400; color: var(--dim); }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--cream);
    background: var(--cream-glow);
  }
  #file-input { display: none; }

  #exif-info {
    margin-top: 10px;
    padding: 9px 11px;
    background: var(--raised);
    border-radius: var(--r-ctl);
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--dim);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  /* ===== SLIDER ROW ===== */
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 10px;
    margin-bottom: 8px;
  }
  .row:last-child { margin-bottom: 0; }

  .row > label { font-size: 12.5px; color: var(--ink); }

  .num { display: inline-flex; align-items: baseline; gap: 2px; justify-self: end; }
  .unit { font-size: 11px; color: var(--dim); min-width: 12px; }

  .row .val {
    width: 52px;
    text-align: right;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 2px 0;
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
    outline: none;
    transition: border-color 0.15s;
  }
  .row .val:hover { border-bottom-color: var(--dim); }
  .row .val:focus { border-bottom-color: var(--cream); }
  .row .val::-webkit-inner-spin-button,
  .row .val::-webkit-outer-spin-button { -webkit-appearance: none; }

  input[type=range] {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 24px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --fill: 0%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--cream) var(--fill), var(--line) var(--fill));
  }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--cream); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    margin-top: -6.5px;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 0 0 0 var(--cream-glow);
    transition: box-shadow 0.15s;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
  }
  input[type=range]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 5px var(--cream-glow); }
  input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 0 8px var(--cream-glow); }
  input[type=range]:focus-visible { outline-offset: 4px; border-radius: 4px; }

  /* ===== COLOR ROW ===== */
  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .color-row:last-child { margin-bottom: 0; }
  .color-row label { font-size: 12.5px; }

  .color-row input[type=color] {
    width: 44px; height: 28px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    background: var(--raised);
    cursor: pointer;
  }
  .color-row input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  .color-row input[type=color]::-webkit-color-swatch { border: 0; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
  .color-row input[type=color]::-moz-color-swatch { border: 0; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }

  /* ===== CHOICE BUTTONS（レイアウト・グレード） ===== */
  .grid-3, .grid-2 { display: grid; gap: 6px; margin-bottom: 14px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }

  .grid-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 40px;
    padding: 9px 6px 8px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .grid-btn small { display: block; font-size: 10.5px; }
  .grid-btn:hover { color: var(--ink); border-color: var(--dim); }
  .grid-btn.active {
    background: var(--cream);
    border-color: var(--cream);
    color: var(--cream-ink);
    font-weight: 500;
  }
  .grid-btn.span-2 { grid-column: 1 / -1; }

  /* 配置の見取り図（写真・余白・文字の位置を縮小して見せる） */
  .glyph { width: 46px; height: 35px; }
  .glyph .paper { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1; }
  .glyph .photo { fill: currentColor; fill-opacity: 0.28; }
  .glyph .cap { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }

  /* グレードの色味見本（暗部／明部の傾き） */
  .chip {
    display: inline-block;
    width: 30px; height: 10px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--a) 50%, var(--b) 50%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  }
  .grade-name { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  #grade-grid .grid-btn { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 9px 12px; text-align: left; }
  #grade-grid .grade-name { align-items: flex-start; }
  #grade-grid .chip { flex-shrink: 0; }

  /* ===== SELECT / TEXTAREA ===== */
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .field > label { font-size: 12.5px; flex-shrink: 0; }

  select {
    flex: 1;
    max-width: 200px;
    min-height: 32px;
    padding: 5px 8px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    cursor: pointer;
    font-size: 12.5px;
  }

  textarea {
    width: 100%;
    min-height: 56px;
    padding: 8px 10px;
    margin-bottom: 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }
  textarea::placeholder { color: var(--dim); }
  select:hover, textarea:hover, .custom-px-row input:hover { border-color: var(--dim); }
  select:focus-visible, textarea:focus-visible, .custom-px-row input:focus-visible {
    outline: none; border-color: var(--cream); box-shadow: 0 0 0 3px var(--cream-glow);
  }

  /* ===== SEGMENTED TOGGLE ===== */
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .opt:last-child { margin-bottom: 0; }
  .opt > span { font-size: 12.5px; }

  .toggle-group {
    display: flex;
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    overflow: hidden;
  }
  .toggle-btn {
    padding: 6px 14px;
    min-height: 32px;
    background: transparent;
    border: 0;
    border-right: 1px solid var(--line);
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s, color 0.15s;
  }
  .toggle-btn:last-child { border-right: 0; }
  .toggle-btn:hover { color: var(--ink); background: var(--raised); }
  .toggle-btn.active { background: var(--cream); color: var(--cream-ink); font-weight: 500; }

  /* ===== SAVE SIZE ===== */
  .preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

  .preset-btn {
    min-height: 32px;
    padding: 5px 13px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .preset-btn:hover { color: var(--ink); border-color: var(--dim); }
  .preset-btn.active { background: var(--cream); border-color: var(--cream); color: var(--cream-ink); font-weight: 500; }

  .custom-px-row { display: flex; align-items: center; gap: 8px; }
  .custom-px-row label { font-size: 12.5px; }
  .custom-px-row input[type=number] {
    width: 92px;
    min-height: 32px;
    padding: 5px 8px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .custom-px-row input::placeholder { color: var(--dim); }
  .custom-px-row .note { font-size: 11.5px; color: var(--dim); }

  /* ===== DOWNLOAD ===== */
  .dock {
    padding: 12px 18px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line-soft);
    background: var(--panel);
  }

  #btn-download {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 11px;
    background: var(--cream);
    border: 0;
    border-radius: var(--r-ctl);
    color: var(--cream-ink);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.1s;
  }
  #btn-download:hover:not(:disabled) { background: #f7e8d2; }
  #btn-download:active:not(:disabled) { transform: translateY(1px); }
  #btn-download:disabled { background: var(--raised); color: var(--dim); cursor: not-allowed; }

  /* ===== BENCH（プレビュー） ===== */
  #preview-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 36px;
    position: relative;
    background: var(--bench);
  }
  #preview-area.drag-over { outline: 2px dashed var(--cream); outline-offset: -14px; }

  #canvas-wrap {
    position: relative;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  @keyframes lay-down { from { opacity: 0; transform: translateY(10px) scale(0.992); } }
  #canvas-wrap { animation: lay-down 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

  .print { position: relative; max-width: 100%; }

  #preview-canvas {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 150px);
    max-height: calc(100dvh - 150px);
    border-radius: 1px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05), 0 22px 56px rgba(0, 0, 0, 0.55);
  }

  #compare-badge {
    position: absolute;
    top: 10px; left: 10px;
    padding: 3px 9px;
    background: rgba(20, 20, 18, 0.78);
    border-radius: var(--r-ctl);
    font-size: 11.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
  }
  #compare-badge.show { opacity: 1; }

  .bench-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #readout {
    font-size: 12px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  #btn-compare {
    min-height: 34px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    color: var(--ink);
    cursor: pointer;
    font-size: 12px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  #btn-compare:hover { border-color: var(--dim); }
  #btn-compare.holding { background: var(--cream); border-color: var(--cream); color: var(--cream-ink); }

  /* ===== EMPTY STATE ===== */
  #preview-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 340px;
    text-align: center;
  }

  .print-demo { width: min(250px, 62vw); height: auto; margin-bottom: 6px; color: var(--cream); }
  .print-demo .pd-paper { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .print-demo .pd-photo { fill: var(--raised); stroke: var(--line); stroke-width: 1; }
  .print-demo .pd-cap { fill: none; stroke: var(--dim); stroke-width: 3; stroke-linecap: round; }

  #preview-placeholder h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.45;
  }
  #preview-placeholder p { color: var(--dim); font-size: 13px; line-height: 1.8; }
  #preview-placeholder p span { display: inline-block; }

  .btn-pick {
    margin-top: 6px;
    min-height: 44px;
    padding: 10px 26px;
    background: var(--cream);
    border: 0;
    border-radius: var(--r-ctl);
    color: var(--cream-ink);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-pick:hover { background: #f7e8d2; }
  .btn-pick:active { transform: translateY(1px); }

  /* 起動時に一度だけ、紙が引かれて写真と文字が置かれる */
  @keyframes pd-draw { from { stroke-dashoffset: 1; } }
  @keyframes pd-in   { from { opacity: 0; } }
  .print-demo .pd-paper { stroke-dasharray: 1; animation: pd-draw 1.1s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  .print-demo .pd-photo { animation: pd-in 0.5s 0.8s both; }
  .print-demo .pd-cap   { animation: pd-in 0.5s 1.15s both; }

  /* ===== TOAST ===== */
  #toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translate(-50%, -8px);
    width: max-content;
    max-width: min(90vw, 360px);
    padding: 9px 15px;
    text-wrap: balance;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 狭い画面：写真を上、操作を下のシートに ===== */
  @media (max-width: 768px) {
    body { flex-direction: column; }

    #preview-area { order: 1; flex: 1; min-height: 0; padding: 14px 14px 10px; }

    #sidebar {
      order: 2;
      width: 100%;
      min-width: 0;
      max-height: var(--sheet-h);
      border-right: 0;
      border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      flex-shrink: 0;
    }

<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
// ===== exifr import =====
// 読み込み完了を待たずにUIを初期化する（CDNが遅くてもボタン等が反応するように）
const exifrReady = import('https://cdn.jsdelivr.net/npm/exifr/dist/full.esm.js')
  .then(mod => mod.default || mod)
  .catch(() => null);

// ===== STATE =====
const S = {
  img: null,
  exif: { date:'', camera:'', lens:'', fnum:'', iso:'', focal:'' },
  layout: 0,
  grade: 'none',
  gradeStr: 60,
  vignette: 0,
  dreamBlur: 0,
  hBlur: 0,
  padTB: 4, padLR: 4, padExtra: 6,
  borderW: 0,
  bgColor: '#ffffff',
  borderColor: '#cccccc',
  txtSize: 2.5,
  txtFont: 'Georgia, serif',
  txtColor: '#333333',
  comment: '',
  commentPos: 'above',
  commentSz: 'large',
  outPx: 1080,
  compare: false,   // 「押している間、元の色を表示」用
};

// ===== EL CACHE =====
const EL = {};
const ids = [
  'drop-zone','file-input','preview-canvas','canvas-wrap','preview-placeholder',
  'exif-info','toast','btn-download',
  'pad-tb','pad-lr','pad-extra','border-w','bg-color','border-color',
  'txt-size','font-sel','txt-color',
  'comment-text','comment-pos-above','comment-pos-below','comment-sz-lg','comment-sz-sm',
  'grade-str','vignette','dream-blur','h-blur',
  'custom-px',
  'v-pad-tb','v-pad-lr','v-pad-extra','v-border-w',
  'v-txt-size','v-grade-str','v-vignette','v-dream-blur','v-h-blur',
];
ids.forEach(id => EL[id] = document.getElementById(id));

// ===== TABS =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// 見た目の .active を、読み上げ用の aria 属性にも反映する
const ariaObserver = new MutationObserver(muts => muts.forEach(m => {
  const t = m.target, on = String(t.classList.contains('active'));
  if (t.hasAttribute('aria-pressed')) t.setAttribute('aria-pressed', on);
  if (t.getAttribute('role') === 'tab') t.setAttribute('aria-selected', on);
}));
document.querySelectorAll('[aria-pressed], [role="tab"]').forEach(el =>
  ariaObserver.observe(el, { attributes: true, attributeFilter: ['class'] }));

// ===== TOAST =====
let toastTimer = null;
function toast(msg, duration=2500) {
  EL['toast'].textContent = msg;
  EL['toast'].classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => EL['toast'].classList.remove('show'), duration);
}

// ===== PERFORMANCE =====
const isMobile = window.innerWidth <= 768;
let renderTimer = null;
let isRendering = false;

// 即時描画（ブラーなし操作用）
function render() {
  if (isRendering) return;
  _doRender();
}

// debounce描画（ブラー系スライダー用・150ms待つ）
function renderDeferred() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    if (!isRendering) _doRender();
  }, 150);
}

function _doRender() {
  isRendering = true;
  try {
    _renderCore();
  } finally {
    isRendering = false;
  }
}

// ===== SLIDER BINDINGS =====
// スライダーの「ここまで」の色塗り（CSS変数 --fill）
function paintFill(slider) {
  const mn = parseFloat(slider.min), mx = parseFloat(slider.max), v = parseFloat(slider.value);
  slider.style.setProperty('--fill', (mx > mn ? ((v - mn) / (mx - mn)) * 100 : 0) + '%');
}

function bindSlider(id, valId, key, deferred=false) {
  const slider = EL[id], numInput = EL[valId];
  const doRender = deferred ? renderDeferred : render;

  // スライダー → 数値欄
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    S[key] = v;
    numInput.value = v;
    paintFill(slider);
    doRender();
  });

  // 数値欄 → スライダー
  numInput.addEventListener('input', () => {
    let v = parseFloat(numInput.value);
    const mn = parseFloat(slider.min), mx = parseFloat(slider.max);
    if (isNaN(v)) return;
    v = Math.min(mx, Math.max(mn, v));
    S[key] = v;
    slider.value = v;
    paintFill(slider);
    doRender();
  });

  // フォーカスを外したときに範囲外の値を補正して表示
  numInput.addEventListener('blur', () => {
    let v = parseFloat(numInput.value);
    const mn = parseFloat(slider.min), mx = parseFloat(slider.max);
    if (isNaN(v)) v = mn;
    v = Math.min(mx, Math.max(mn, v));
    numInput.value = v;
    S[key] = v;
    slider.value = v;
    paintFill(slider);
    render();
  });
}
bindSlider('pad-tb','v-pad-tb','padTB');
bindSlider('pad-lr','v-pad-lr','padLR');
bindSlider('pad-extra','v-pad-extra','padExtra');
bindSlider('border-w','v-border-w','borderW');
bindSlider('txt-size','v-txt-size','txtSize');
bindSlider('grade-str','v-grade-str','gradeStr', true);
bindSlider('vignette','v-vignette','vignette', true);
bindSlider('dream-blur','v-dream-blur','dreamBlur', true);
bindSlider('h-blur','v-h-blur','hBlur', true);
document.querySelectorAll('input[type=range]').forEach(paintFill);

// Color
['bg-color','border-color','txt-color'].forEach(id => {
  EL[id].addEventListener('input', () => {
    const map = {'bg-color':'bgColor','border-color':'borderColor','txt-color':'txtColor'};
    S[map[id]] = EL[id].value;
    render();
  });
});

// Font
EL['font-sel'].addEventListener('change', () => { S.txtFont = EL['font-sel'].value; render(); });

// Comment
EL['comment-text'].addEventListener('input', () => { S.comment = EL['comment-text'].value; render(); });

// Comment pos/sz toggles
['comment-pos-above','comment-pos-below'].forEach(id => {
  EL[id].addEventListener('click', () => {
    EL['comment-pos-above'].classList.toggle('active', id==='comment-pos-above');
    EL['comment-pos-below'].classList.toggle('active', id==='comment-pos-below');
    S.commentPos = EL[id].dataset.pos;
    render();
  });
});
['comment-sz-lg','comment-sz-sm'].forEach(id => {
  EL[id].addEventListener('click', () => {
    EL['comment-sz-lg'].classList.toggle('active', id==='comment-sz-lg');
    EL['comment-sz-sm'].classList.toggle('active', id==='comment-sz-sm');
    S.commentSz = EL[id].dataset.sz;
    render();
  });
});

// Layout grid

// ===== DROP / FILE =====
const dz = EL['drop-zone'];
dz.addEventListener('click', () => EL['file-input'].click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
EL['file-input'].addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
document.getElementById('btn-pick').addEventListener('click', () => EL['file-input'].click());
const pa = document.getElementById('preview-area');
pa.addEventListener('dragover', e => { e.preventDefault(); pa.classList.add('drag-over'); });
pa.addEventListener('dragleave', e => { if (!pa.contains(e.relatedTarget)) pa.classList.remove('drag-over'); });
pa.addEventListener('drop', e => { e.preventDefault(); pa.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });

let loadSeq = 0;
async function loadFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('この形式は読み込めません。JPEG・PNG・WebPを選んでください'); return; }
  const seq = ++loadSeq;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    URL.revokeObjectURL(url);
    if (seq !== loadSeq) return; // 後から別の画像が選ばれた
    S.img = img;
    // 前の写真のExifが残らないようにリセット
    S.exif = { date:'', camera:'', lens:'', fnum:'', iso:'', focal:'' };
    EL['preview-placeholder'].style.display = 'none';
    EL['canvas-wrap'].style.display = 'flex';
    document.getElementById('dz-main').textContent = '別の写真を選ぶ';
    EL['btn-download'].disabled = false;
    await loadExif(file, seq);
    if (seq !== loadSeq) return;
    render();
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    toast('画像を読み込めませんでした。JPEG・PNG・WebPを選んでください');
  };
  img.src = url;
}

async function loadExif(file, seq) {
  const exifr = await exifrReady;
  if (!exifr || seq !== loadSeq) return;
  try {
    const raw = await exifr.parse(file, true);
    if (seq !== loadSeq) return;
    if (!raw) {
      EL['exif-info'].style.display = 'block';
      EL['exif-info'].textContent = 'Exifなし';
      return;
    }
    const e = S.exif;
    const dateRaw = raw.DateTimeOriginal || raw.DateTimeDigitized || raw.DateTime;
    if (dateRaw) {
      const d = typeof dateRaw === 'string'
        ? dateRaw.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1/$2/$3')
        : dateRaw.toLocaleDateString('ja-JP');
      e.date = d.split(' ')[0];
    }
    e.camera = raw.Make && raw.Model
      ? (raw.Model.includes(raw.Make) ? raw.Model : raw.Make + ' ' + raw.Model).trim()
      : raw.Model || raw.Make || '';
    e.lens = raw.LensModel || raw.Lens || '';
    const fraw = raw.FNumber || raw.ApertureValue;
    e.fnum = fraw ? 'f/' + (typeof fraw==='number' ? fraw.toFixed(1) : fraw) : '';
    const isoRaw = raw.ISO || raw.ISOSpeedRatings || raw.PhotographicSensitivity;
    e.iso = isoRaw ? 'ISO ' + (Array.isArray(isoRaw) ? isoRaw[0] : isoRaw) : '';
    const fl = raw.FocalLength;
    e.focal = fl ? (typeof fl==='number' ? fl.toFixed(0) : fl) + 'mm' : '';

    const got = [e.date,e.camera,e.lens,e.fnum].filter(Boolean).length;
    toast(`Exifを読み込みました（${got}/4項目）`);
    const info = [e.camera, e.lens, [e.focal, e.fnum, e.iso].filter(Boolean).join('   '), e.date]
      .filter(Boolean).join('\n');
    EL['exif-info'].style.display = 'block';
    EL['exif-info'].textContent = info || 'Exifなし';
  } catch(err) {
    EL['exif-info'].style.display = 'block';
    EL['exif-info'].textContent = 'Exif読み込み失敗';
  }
}

// ===== RENDER =====
function _renderCore() {
  if (!S.img) return;

  const canvas = EL['preview-canvas'];
  const ctx = canvas.getContext('2d');

  const iw = S.img.naturalWidth, ih = S.img.naturalHeight;

  // Padding in fractions of short side
  const shortSide = Math.min(iw, ih);
  const padTB = (S.padTB / 100) * shortSide;
  const padLR = (S.padLR / 100) * shortSide;
  const padExtra = (S.padExtra / 100) * shortSide;

  const canvasW = iw + padLR * 2;
  const canvasH = ih + padTB * 2 + padExtra;
  canvas.width = canvasW;
  canvas.height = canvasH;

  // Background
  ctx.fillStyle = S.bgColor;
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Border (shortSide基準の%→px換算)
  const borderPx = (S.borderW / 100) * shortSide;
  if (borderPx > 0) {
    ctx.strokeStyle = S.borderColor;
    ctx.lineWidth = borderPx;
    ctx.strokeRect(padLR - borderPx/2, padTB - borderPx/2, iw + borderPx, ih + borderPx);
  }

  // Draw image
  ctx.drawImage(S.img, padLR, padTB, iw, ih);

  // Color grade
  const fx = !S.compare;
  if (fx && S.grade !== 'none' && S.gradeStr > 0) {
    applyGrade(ctx, padLR, padTB, iw, ih, S.grade, S.gradeStr / 100);
  }

  // Vignette
  if (fx && S.vignette > 0) {
    applyVignette(ctx, padLR, padTB, iw, ih, S.vignette / 100);
  }

  // Dream blur
  if (fx && S.dreamBlur > 0) {
    applyDreamBlur(ctx, padLR, padTB, iw, ih, S.img, S.dreamBlur / 100);
  }

  // Horizontal blur
  if (fx && S.hBlur > 0) {
    applyHBlur(ctx, padLR, padTB, iw, ih, S.img, S.hBlur / 100);
  }

  // Exif text
  const txtPx = (S.txtSize / 100) * shortSide;
  const commentPx = S.commentSz === 'large' ? txtPx * 1.5 : txtPx;

  drawExif(ctx, padLR, padTB, iw, ih, padExtra, txtPx, commentPx);
  updateReadout();
}

// 保存したときのピクセル数を、プレビューの下に出す
function outputSize() {
  const c = EL['preview-canvas'];
  if (S.outPx === 0) return [c.width, c.height];
  const scale = S.outPx / Math.max(c.width, c.height);
  return [Math.round(c.width * scale), Math.round(c.height * scale)];
}
function updateReadout() {
  if (!S.img) return;
  const [w, h] = outputSize();
  document.getElementById('readout').textContent = `保存サイズ ${w} × ${h} px`;
}

// ===== GRADE =====
function applyGrade(ctx, x, y, w, h, grade, str) {
  const imageData = ctx.getImageData(x, y, w, h);
  const src = imageData.data;
  const dst = new Uint8ClampedArray(src);

  for (let i = 0; i < src.length; i += 4) {
    let r = src[i], g = src[i+1], b = src[i+2];

    if (grade === 'cinema') {
      // Teal & Orange
      const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      const warm = lum > 0.5;
      if (warm) { r = Math.min(255, r + 20); b = Math.max(0, b - 20); }
      else { g = Math.min(255, g + 10); b = Math.min(255, b + 30); }
      // contrast
      r = clamp(((r/255 - 0.5)*1.15 + 0.5)*255);
      g = clamp(((g/255 - 0.5)*1.15 + 0.5)*255);
      b = clamp(((b/255 - 0.5)*1.15 + 0.5)*255);
      // desaturate slightly
      const avg = (r+g+b)/3;
      r = lerp(r, avg, 0.05); g = lerp(g, avg, 0.05); b = lerp(b, avg, 0.05);
    } else if (grade === 'film') {
      // Shadow mat
      r = Math.max(20, r); g = Math.max(18, g); b = Math.max(15, b);
      // Brown overlay
      r = lerp(r, 210, 0.05); g = lerp(g, 175, 0.03); b = lerp(b, 130, 0.02);
      // Grain
      const grain = (Math.random()-0.5)*22;
      r = clamp(r+grain); g = clamp(g+grain*0.95); b = clamp(b+grain*0.9);
    } else if (grade === 'noir') {
      // Desaturate
      const lum = r*0.299 + g*0.587 + b*0.114;
      r = lerp(r, lum, 0.8); g = lerp(g, lum, 0.8); b = lerp(b, lum, 0.8);
      // High contrast
      r = clamp(((r/255 - 0.5)*1.4 + 0.5)*255);
      g = clamp(((g/255 - 0.5)*1.4 + 0.5)*255);
      b = clamp(((b/255 - 0.5)*1.4 + 0.5)*255);
      // Shadow grain
      if (r < 80) { const n=(Math.random()-0.5)*18; r=clamp(r+n); g=clamp(g+n); b=clamp(b+n); }
    } else if (grade === 'portra') {
      // Kodak Portra 400 風
      const lum0 = (r*0.299 + g*0.587 + b*0.114) / 255;
      // 緑を黄色寄りに（緑が突出している画素ほど R を足し B を引く）
      const greenness = Math.max(0, g - Math.max(r, b));
      r += greenness * 0.35; b -= greenness * 0.15;
      // 彩度を控えめに（輝度へ18%寄せる）
      const lum = r*0.299 + g*0.587 + b*0.114;
      r = lerp(r, lum, 0.18); g = lerp(g, lum, 0.18); b = lerp(b, lum, 0.18);
      // 暖色寄りのホワイトバランス
      r *= 1.05; g *= 1.01; b *= 0.93;
      // トーンカーブ：シャドウを持ち上げてマットに・中間を少し明るく・白は飛ばさない
      r = portraTone(r); g = portraTone(g); b = portraTone(b);
      // ハイライトをクリーム色へ
      const hl = smoothstep(0.6, 1.0, lum0) * 0.3;
      r = clamp(lerp(r, 250, hl)); g = clamp(lerp(g, 240, hl)); b = clamp(lerp(b, 218, hl));
    }

    dst[i]   = lerp(src[i],   r, str);
    dst[i+1] = lerp(src[i+1], g, str);
    dst[i+2] = lerp(src[i+2], b, str);
    dst[i+3] = src[i+3];
  }

  imageData.data.set(dst);
  ctx.putImageData(imageData, x, y);
}

function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, v) { const t = Math.max(0, Math.min(1, (v - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }
// 黒→約15、白→約245。中間(0.5)は約+9明るく
function portraTone(v) {
  const x = Math.max(0, Math.min(1, v / 255));
  return (0.06 + 0.9 * (x + 0.12 * x * (1 - x))) * 255;
}

// ===== VIGNETTE =====
function applyVignette(ctx, x, y, w, h, str) {
  const cx = x + w/2, cy = y + h/2;
  const r = Math.sqrt(w*w + h*h) * 0.5;
  const grad = ctx.createRadialGradient(cx, cy, r*0.3, cx, cy, r);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${str * 0.85})`);
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
}

// ===== DREAM BLUR =====
function applyDreamBlur(ctx, x, y, w, h, img, amount) {
  const maxSteps = isMobile ? 6 : 20;
  const steps = Math.round(3 + amount * (maxSteps - 3));
  const maxScale = 1 + amount * 0.08;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const sc = 1 + (maxScale - 1) * t;
    const alpha = (1 - t) * 0.15;
    ctx.globalAlpha = alpha;
    const nx = x + w/2 - (w * sc)/2;
    const ny = y + h/2 - (h * sc)/2;
    ctx.drawImage(img, nx, ny, w * sc, h * sc);
  }
  ctx.restore();
}

// ===== HORIZONTAL BLUR =====
function applyHBlur(ctx, x, y, w, h, img, amount) {
  const maxSteps = isMobile ? 6 : 24;
  const steps = Math.round(4 + amount * (maxSteps - 4));
  const maxStretchX = 1 + amount * 0.18;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const scX = 1 + (maxStretchX - 1) * t; // 水平のみ拡大
    const alpha = (1 - t) * 0.12;
    ctx.globalAlpha = alpha;
    // 水平のみ拡大（垂直は変えない）
    const nw = w * scX;
    const nx = x + w/2 - nw/2;
    ctx.drawImage(img, nx, y, nw, h);
  }
  ctx.restore();
}

// ===== EXIF LAYOUT =====
function drawExif(ctx, px, py, pw, ph, padExtra, txtPx, commentPx) {
  const e = S.exif;
  const midY = py + ph + padExtra * 0.5;

  ctx.font = `italic ${txtPx}px ${S.txtFont}`;
  ctx.fillStyle = S.txtColor;

  const line1 = [e.date, e.camera].filter(Boolean).join('  ');
  const line2 = [e.lens, e.focal].filter(Boolean).join('  ');
  const line3 = [e.fnum, e.iso].filter(Boolean).join('  ');
  const shotOn = e.camera ? `Shot on ${e.camera}` : '';
  const leftTop = [e.camera, e.lens].filter(Boolean).join(' / ');
  const rightTop = [e.focal, e.fnum, e.iso].filter(Boolean).join('  ');
  const rightBottom = e.date;
  const dotline = [e.date, e.camera, e.lens].filter(Boolean).join(' · ');

  const layouts = {
    0: () => { // 左下2行
      if (S.comment && S.commentPos === 'above') drawComment(ctx, px, midY - txtPx*1.2, pw, commentPx, txtPx, 'left');
      ctx.textAlign = 'left';
      if (line1) ctx.fillText(line1, px, midY);
      if (line2 || line3) ctx.fillText([line2,line3].filter(Boolean).join('  '), px, midY + txtPx * 1.4);
      if (S.comment && S.commentPos === 'below') drawComment(ctx, px, midY + txtPx*2.8, pw, commentPx, txtPx, 'left');
    },
    1: () => { // 中央 Shot on
      ctx.textAlign = 'center';
      const cx = px + pw/2;
      if (S.comment && S.commentPos === 'above') drawComment(ctx, cx, midY - txtPx*1.2, pw, commentPx, txtPx, 'center');
      if (shotOn) {
        ctx.font = `${txtPx}px ${S.txtFont}`;
        ctx.fillText('Shot on', cx, midY);
        ctx.font = `bold ${txtPx*1.15}px ${S.txtFont}`;
        ctx.fillText(e.camera||'', cx, midY + txtPx * 1.4);
        ctx.font = `italic ${txtPx}px ${S.txtFont}`;
      }
      if (S.comment && S.commentPos === 'below') drawComment(ctx, cx, midY + txtPx*2.8, pw, commentPx, txtPx, 'center');
    },
    2: () => { // 左右4点
      ctx.textAlign = 'left';
      if (leftTop) ctx.fillText(leftTop, px, midY);
      ctx.textAlign = 'right';
      if (rightTop) ctx.fillText(rightTop, px+pw, midY);
      ctx.textAlign = 'left';
      if (S.comment) ctx.fillText(S.comment, px, midY + txtPx*1.4);
      ctx.textAlign = 'right';
      if (rightBottom) ctx.fillText(rightBottom, px+pw, midY + txtPx*1.4);
    },
    3: () => { // 右下2行
      ctx.textAlign = 'right';
      const rx = px + pw;
      if (S.comment && S.commentPos === 'above') drawComment(ctx, rx, midY - txtPx*1.2, pw, commentPx, txtPx, 'right');
      if (line1) ctx.fillText(line1, rx, midY);
      if (line2 || line3) ctx.fillText([line2,line3].filter(Boolean).join('  '), rx, midY + txtPx*1.4);
      if (S.comment && S.commentPos === 'below') drawComment(ctx, rx, midY + txtPx*2.8, pw, commentPx, txtPx, 'right');
    },
    4: () => { // 中央1行
      ctx.textAlign = 'center';
      const cx = px + pw/2;
      if (S.comment && S.commentPos === 'above') drawComment(ctx, cx, midY - txtPx*1.2, pw, commentPx, txtPx, 'center');
      if (dotline) ctx.fillText(dotline, cx, midY);
      if (S.comment && S.commentPos === 'below') drawComment(ctx, cx, midY + txtPx*1.6, pw, commentPx, txtPx, 'center');
    },
    5: () => { // 左右シンプル
      ctx.font = `bold ${txtPx*1.3}px ${S.txtFont}`;
      ctx.textAlign = 'left';
      if (e.camera) ctx.fillText(e.camera, px, midY);
      ctx.font = `italic ${txtPx}px ${S.txtFont}`;
      ctx.textAlign = 'right';
      if (e.date) ctx.fillText(e.date, px+pw, midY);
    },
  };

  (layouts[S.layout] || layouts[0])();
}

function drawComment(ctx, anchorX, y, pw, commentPx, txtPx, align) {
  if (!S.comment) return;
  ctx.save();
  ctx.textAlign = align;
  ctx.font = `italic ${commentPx}px ${S.txtFont}`;
  ctx.fillStyle = S.txtColor;
  ctx.fillText(S.comment, anchorX, y);
  ctx.restore();
}

// ===== DOWNLOAD =====
EL['btn-download'].addEventListener('click', () => {
  if (!S.img) return;

  const src = EL['preview-canvas'];
  const outPx = S.outPx;
  const sw = src.width, sh = src.height;

  let dw, dh;
  if (outPx === 0) { dw = sw; dh = sh; }
  else {
    const scale = outPx / Math.max(sw, sh);
    dw = Math.round(sw * scale);
    dh = Math.round(sh * scale);
  }

  const out = document.createElement('canvas');
  out.width = dw; out.height = dh;
  const oct = out.getContext('2d');
  oct.imageSmoothingQuality = 'high';
  oct.drawImage(src, 0, 0, dw, dh);

  out.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `framia-${dw}px.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast(`保存しました: framia-${dw}px.png`);
  }, 'image/png');
});

// ===== 比較：押している間だけ、元の色（グレード・エフェクトなし）を見る =====
const cmpBtn = document.getElementById('btn-compare');
const cmpBadge = document.getElementById('compare-badge');
function setCompare(on) {
  if (S.compare === on) return;
  S.compare = on;
  cmpBtn.classList.toggle('holding', on);
  cmpBadge.classList.toggle('show', on);
  if (S.img) render();
}
cmpBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (cmpBtn.setPointerCapture) cmpBtn.setPointerCapture(e.pointerId);
  setCompare(true);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
  cmpBtn.addEventListener(t, () => setCompare(false)));
cmpBtn.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); setCompare(true); }
});
cmpBtn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') setCompare(false); });
cmpBtn.addEventListener('blur', () => setCompare(false));

// ===== 狭い画面：設定シートの開閉（写真を大きく見たいとき） =====
const sheetBtn = document.getElementById('sheet-toggle');
sheetBtn.addEventListener('click', () => {
  const collapsed = document.body.classList.toggle('sheet-collapsed');
  sheetBtn.setAttribute('aria-expanded', String(!collapsed));
  sheetBtn.setAttribute('aria-label', collapsed ? '設定パネルを開く' : '設定パネルを閉じる');
});
